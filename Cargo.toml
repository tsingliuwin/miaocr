[workspace]
members = ["crates/vision", "crates/ui", "crates/agent", "crates/llm", "crates/tools"]
resolver = "2"

# ── 构建配置 ─────────────────────────────────────────────────────────
# cc-rs 会把 `-Z7`（调试信息）传给 C/C++ 编译器。本机 MSVC 14.44.35207 下
# 该参数会触发 `error D8050: 无法执行 c1xx.dll / 未能将命令行放入调试记录中`，
# 而同一条命令手工执行却成功（cargo 子进程环境下才复现）。
# 依赖（含 ring / ocr-rs / oar-ocr 等原生库）不需要调试信息，统一关掉即可，
# 顺带把 dev 构建出包体积和链接时间都降下来。
#
# opt-level = 1：MNN / ONNX 推理与 OCR 预处理在纯 debug 下慢到不可用。
[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1