[package]
name = "vision"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
screenshots = "0.8"
sevenz-rust = "0.5"
ocr-rs = { path = "../../3rd_party/ocr-rs", features = ["build-mnn-from-source"] }
oar-ocr = { path = "../../3rd_party/oar-ocr" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Globalization",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }