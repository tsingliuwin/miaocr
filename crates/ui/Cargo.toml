[package]
name = "miaocr-ui"
version = "1.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
# 产物名固定为 miaocr：这是面向用户的产品名，不随 crate 命名变化。
# crate 本身叫 miaocr-ui 只是内部区分（cargo -p miaocr-ui）。
name = "miaocr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
agent = { path = "../agent" }
gpui-kit = "0.9"
image = "0.25"
llm = { path = "../llm" }
screenshots = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
smallvec = "1"
tools = { path = "../tools" }
vision = { path = "../vision" }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"